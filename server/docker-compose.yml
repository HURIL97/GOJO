services:
  hospitalis-sync:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"   # exposé via Caddy (HTTPS), pas directement sur Internet
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    # réseau hôte : Caddy écoute 80/443 et joint le service sur 127.0.0.1:8787
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    network_mode: host

volumes:
  caddy_data:
