name: OfficiaTech — installateur Windows

on:
  workflow_dispatch:
  push:
    tags: ['officia-v*']
    branches: [main]
    paths:
      - 'officia/**'
      - '.github/workflows/officia-windows.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: officia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: officia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: OfficiaTech-Windows
          path: |
            officia/release/*.exe
            officia/release/*.zip
          if-no-files-found: error
      # Une étiquette « officia-vX.Y.Z » publie la version : OfficiaTech la propose alors en mise à jour.
      - name: Publication de la version
        if: startsWith(github.ref, 'refs/tags/officia-v')
        uses: softprops/action-gh-release@v2
        with:
          name: OfficiaTech ${{ github.ref_name }}
          body_path: officia/CHANGELOG.md
          files: |
            officia/release/*.exe
            officia/release/*.zip
