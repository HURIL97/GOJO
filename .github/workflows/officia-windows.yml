name: OfficiaTech — installateur Windows

on:
  workflow_dispatch:
    inputs:
      publier:
        description: 'Publier la version (page Releases + mise à jour proposée dans OfficiaTech)'
        type: boolean
        default: false
  push:
    tags: ['officia-v*']
    branches: [main]
    paths:
      - 'officia/**'
      - '.github/workflows/officia-windows.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: officia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: officia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: OfficiaTech-Windows
          path: |
            officia/release/*.exe
            officia/release/*.zip
          if-no-files-found: error
      # Une étiquette « officia-vX.Y.Z », ou « Run workflow » avec « publier », publie la version :
      # OfficiaTech la propose alors en mise à jour.
      - name: Numéro de version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publication de la version
        if: startsWith(github.ref, 'refs/tags/officia-v') || inputs.publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: officia-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OfficiaTech ${{ steps.v.outputs.version }}
          body_path: officia/CHANGELOG.md
          files: |
            officia/release/*.exe
            officia/release/*.zip
